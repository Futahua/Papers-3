<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Papers</title>
<style>html,body{margin:0;height:100%;background:#2b302f;overflow:hidden}#ayg,.papers-layer{position:fixed;inset:0;width:100%;height:100%;border:0;background:#2b302f}#ayg{visibility:hidden}.papers-layer{z-index:2}.papers-layer.is-entering{animation:papers-layer-in 240ms cubic-bezier(.2,.8,.2,1)}.papers-layer.is-leaving{animation:papers-layer-out 190ms ease-in forwards;pointer-events:none}@keyframes papers-layer-in{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}@keyframes papers-layer-out{to{opacity:0;transform:translateY(20px) scale(.99)}}@media (prefers-reduced-motion:reduce){.papers-layer.is-entering,.papers-layer.is-leaving{animation-duration:1ms}}</style>
<script type="module" src="phone-host.js"></script></head>
<body><iframe id="ayg" title="As you Go"></iframe></body></html>
