<!doctype html>
<meta charset="utf-8">
<title>As You Go — Assignment 011 interior effects fixture</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #faf8f1; color: #3d3932; font: 14px system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  figure { margin: 0; max-width: 980px; width: 100%; }
  svg { display: block; width: 100%; height: auto; border: 1px solid #d6d0c4; background: #fffdf7; }
  figcaption { margin-top: 10px; color: #756b5d; line-height: 1.45; }
  .body { fill: color-mix(in oklab, var(--set-color) 10%, transparent); stroke: color-mix(in oklab, var(--set-color) 45%, #5b554c); stroke-width: 2; }
  .region { fill: color-mix(in oklab, var(--region-color) 22%, transparent); pointer-events: none; }
  .region.shared { fill: color-mix(in oklab, var(--region-color) 32%, transparent); }
  .glyph { fill: none; stroke: var(--set-color); stroke-width: 1.65; opacity: .9; vector-effect: non-scaling-stroke; }
  .label { font-weight: 650; letter-spacing: .04em; }
  .sub { fill: #756b5d; font-size: 12px; }
  .graph-set-effects-layer, .graph-set-interior-ripple, .graph-set-interior-wash { pointer-events: none; overflow: visible; }
  .graph-set-interior-ripple { vector-effect: non-scaling-stroke; }
  .graph-set-interior-wash { vector-effect: non-scaling-stroke; }
</style>
<figure>
  <svg id="fixture" viewBox="0 0 980 510" aria-label="Named set and overlapping pair interior effects">
    <text class="label" x="28" y="32">IDEAS — RIPPLE</text>
    <text class="sub" x="28" y="49">named set / selected</text>
    <text class="label" x="508" y="32">ALPHA + BETA — RIPPLE / WASH</text>
    <text class="sub" x="508" y="49">overlapping pair / shared lens has one owner</text>
  </svg>
  <figcaption>Ripple and wash are rendered inside large region surfaces. Alpha owns the shared lens when Alpha and Beta are both selected; the project glyph lettering remains on top and readable.</figcaption>
</figure>
<script type="module">
  import { animate } from './public/vendor/anime.js';
  import { createSetEffectsController } from './public/set-effects-model.js';
  import { glyphPath, layoutTitleGlyphs } from './public/set-glyph-model.js';

  const svg = document.querySelector('#fixture');
  const NS = 'http://www.w3.org/2000/svg';
  const bodyLayer = document.createElementNS(NS, 'g');
  const regionLayer = document.createElementNS(NS, 'g');
  const effectsLayer = document.createElementNS(NS, 'g');
  const glyphLayer = document.createElementNS(NS, 'g');
  effectsLayer.setAttribute('class', 'graph-set-effects-layer');
  svg.append(bodyLayer, regionLayer, effectsLayer, glyphLayer);

  const sets = [
    { id: 'ideas', title: 'IDEAS', color: 'oklch(68% .18 145)', outline: [{ x: 80, y: 160 }, { x: 360, y: 160 }, { x: 360, y: 370 }, { x: 80, y: 370 }], d: 'M80 260 C80 190 125 160 220 160 C315 160 360 190 360 260 C360 340 315 370 220 370 C125 370 80 340 80 260' },
    { id: 'alpha', title: 'A', color: 'oklch(68% .18 210)', outline: [{ x: 560, y: 160 }, { x: 770, y: 160 }, { x: 770, y: 370 }, { x: 560, y: 370 }], d: 'M560 260 C560 190 600 160 665 160 C730 160 770 190 770 260 C770 340 730 370 665 370 C600 370 560 340 560 260' },
    { id: 'beta', title: 'B', color: 'oklch(68% .18 285)', outline: [{ x: 700, y: 160 }, { x: 910, y: 160 }, { x: 910, y: 370 }, { x: 700, y: 370 }], d: 'M700 260 C700 190 740 160 805 160 C870 160 910 190 910 260 C910 340 870 370 805 370 C740 370 700 340 700 260' },
  ];
  const regionSpecs = [
    { id: 'ideas', setIds: ['ideas'], center: { x: 220, y: 260 }, d: sets[0].d, color: sets[0].color },
    { id: 'alpha', setIds: ['alpha'], center: { x: 635, y: 260 }, d: 'M560 260 C560 190 600 160 665 160 L700 185 L700 335 L665 370 C600 370 560 340 560 260', color: sets[1].color },
    { id: 'alpha|beta', setIds: ['alpha', 'beta'], center: { x: 735, y: 260 }, d: 'M700 185 C730 168 770 160 805 160 C870 160 910 190 910 260 C910 340 870 370 805 370 C770 370 730 352 700 335 Z', color: 'oklch(70% .18 248)' },
    { id: 'beta', setIds: ['beta'], center: { x: 875, y: 260 }, d: 'M700 335 L700 185 L740 160 C805 160 845 190 845 260 C845 340 805 370 740 370 Z', color: sets[2].color },
  ];

  for (const set of sets) {
    const body = document.createElementNS(NS, 'path');
    body.setAttribute('class', 'body');
    body.setAttribute('d', set.d);
    body.style.setProperty('--set-color', set.color);
    bodyLayer.append(body);
    const glyph = document.createElementNS(NS, 'path');
    glyph.setAttribute('class', 'glyph');
    glyph.style.setProperty('--set-color', set.color);
    glyph.setAttribute('d', glyphPath(layoutTitleGlyphs(set.outline, set.title, { preferredHeight: 15, gap: 5 })));
    glyphLayer.append(glyph);
  }

  const regions = new Map();
  for (const spec of regionSpecs) {
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', `region${spec.id.includes('|') ? ' shared' : ''}`);
    path.setAttribute('d', spec.d);
    path.style.setProperty('--region-color', spec.color);
    regionLayer.append(path);
    regions.set(spec.id, { id: spec.id, path, setIds: spec.setIds, center: spec.center, outline: [] });
  }

  const values = [0, 1 / 3, 2 / 3];
  let index = 0;
  const effects = createSetEffectsController({ document, animate, random: () => values[index++ % values.length] });
  effects.sync({ selectedSetIds: ['ideas', 'alpha', 'beta'], regions, colorFor: (id) => regions.get(id)?.path.style.getPropertyValue('--region-color'), effectsLayer });
</script>
